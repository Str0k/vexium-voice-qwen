[project]
name = "vexium-voice-qwen"
version = "0.2.0"
description = "Bilingual voice and text receptionist with Qwen and a FastAPI bridge"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "alibabacloud-dysmsapi20170525>=4.6,<5",
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<0.29",
    "openai>=3.13,<4",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.2,<2",
    "stripe>=15.6,<17",
    "tablestore>=6.4.8,<7",
    "uvicorn[standard]>=0.52.4,<1",
    "websockets>=17.1,<18",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-socket>=0.7,<1",
    "respx>=0.23.1,<1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "dev_client.py", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
